    - data:
        code: "import datetime\nimport json\nimport re\n\nWEEK = [\"周一\", \"周二\",\
          \ \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef _today() -> str:\n  \
          \  \"\"\"今天是几号。显式用 UTC+8 —— 容器默认多半是 UTC，不指定会差一天。\"\"\"\n    tz = datetime.timezone(datetime.timedelta(hours=8))\n\
          \    now = datetime.datetime.now(tz)\n    return now.strftime(\"%Y-%m-%d\"\
          ) + \" \" + WEEK[now.weekday()]\n\n\ndef _score(item: dict) -> float:\n\
          \    try:\n        return float(item.get(\"score\", 0))\n    except Exception:\n\
          \        return 0.0\n\n\ndef _as_list(x):\n    if isinstance(x, str):\n\
          \        try:\n            x = json.loads(x)\n        except Exception:\n\
          \            return []\n    if isinstance(x, dict):\n        for k in (\"\
          articles\", \"result\", \"data\", \"items\", \"list\"):\n            if\
          \ isinstance(x.get(k), list):\n                return x[k]\n        return\
          \ [x]\n    return x if isinstance(x, list) else []\n\n\ndef _extract_json(text:\
          \ str):\n    if not text:\n        return None\n    text = re.sub(r\"<think>.*?</think>\"\
          , \"\", text, flags=re.S)\n    text = text.replace(\"<think>\", \"\").replace(\"\
          </think>\", \"\")\n    text = re.sub(r\"```(?:json)?\", \"\", text)\n  \
          \  start, end = text.find(\"[\"), text.rfind(\"]\")\n    if start == -1\
          \ or end <= start:\n        return None\n    try:\n        return json.loads(text[start:end\
          \ + 1])\n    except Exception:\n        return None\n\n\ndef main(raw: str,\
          \ items: str) -> dict:\n    \"\"\"把「模型打分」和「节点 3 的原文」按 id 合并，再排序取前 20。\"\"\
          \"\n    today = _today()\n\n    scored = _extract_json(raw or \"\")\n  \
          \  if not isinstance(scored, list):\n        return {\"ok\": False, \"error\"\
          : \"解析失败：\" + (raw or \"\")[:200],\n                \"items\": \"[]\", \"\
          count\": 0, \"today\": today}\n\n    origin = {}\n    for a in _as_list(items):\n\
          \        if isinstance(a, dict) and a.get(\"id\"):\n            origin[a[\"\
          id\"]] = a\n\n    merged = []\n    for s in scored:\n        if not isinstance(s,\
          \ dict) or _score(s) < 6:\n            continue\n        o = origin.get(s.get(\"\
          id\"), {})\n        merged.append({\n            \"title\": o.get(\"title\"\
          , \"\"),\n            \"link\": o.get(\"link\", \"\"),\n            \"source\"\
          : o.get(\"source\", \"\"),\n            \"published\": o.get(\"published\"\
          , \"\"),\n            \"snippet\": o.get(\"snippet\", \"\"),\n         \
          \   \"score\": _score(s),\n            \"category\": s.get(\"category\"\
          , \"\"),\n            \"reason\": s.get(\"reason\", \"\"),\n        })\n\
          \n    merged.sort(key=lambda x: x[\"score\"], reverse=True)\n    top = merged[:20]\n\
          \    return {\"ok\": True, \"error\": \"\",\n            \"items\": json.dumps(top,\
          \ ensure_ascii=False),\n            \"count\": len(top), \"today\": today}\n"
        code_language: python3
