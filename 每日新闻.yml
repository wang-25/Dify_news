    - data:
        code: "import json, re, datetime\nfrom urllib.parse import urlparse\n\n# 源名映射：RSS\
          \ Reader 返回的 author 是文章作者，不是媒体名，所以按域名反查\nDOMAIN_SRC = {\n    \"qbitai.com\"\
          : \"量子位\",\n    \"openai.com\": \"OpenAI\",\n    \"leiphone.com\": \"雷锋网\"\
          ,\n    \"infoq.cn\": \"InfoQ\",\n    \"ithome.com\": \"IT之家\",\n    \"github.com\"\
          : \"GitHub\",          # 新增\n    \"arxiv.org\": \"arXiv\",            #\
          \ 新增\n    \"rsshub.rssforever.com\": \"GitHubTrending\",   # 兜底，万一 RSSHub\
          \ 没还原原始链接\n    \"techcrunch.com\": \"TechCrunch\",\n    \"theverge.com\"\
          : \"The Verge\",\n}\n# 删掉 \"hn.algolia.com\" —— 那个源已经移除了\n\n\n\ndef guess_source(link:\
          \ str) -> str:\n    host = urlparse(link).netloc.lower()\n    for key, name\
          \ in DOMAIN_SRC.items():\n        if key in host:\n            return name\n\
          \    return host\n\n\ndef _as_list(x):\n    \"\"\"把迭代输出的各种可能形态统一成 list[dict]：\n\
          \    - JSON 字符串       → json.loads 后重试\n    - {\"articles\": []}  → 取出里面那个列表\n\
          \    - 单个 dict         → 包成 [dict]\n    - 已经是 list       → 直接用\n    \"\"\
          \"\n    if isinstance(x, str):\n        try:\n            x = json.loads(x)\n\
          \        except Exception:\n            return []\n    if isinstance(x,\
          \ dict):\n        for k in (\"articles\", \"result\", \"data\", \"items\"\
          , \"list\"):\n            if isinstance(x.get(k), list):\n             \
          \   return x[k]\n        return [x]\n    if isinstance(x, list):\n     \
          \   return x\n    return []\n\n\ndef main(items: list) -> dict:\n    now\
          \ = datetime.datetime.now(datetime.timezone.utc)\n    seen_links, seen_titles\
          \ = set(), set()\n    out = []\n\n    for it in items:\n        # 迭代输出可能是一维（已扁平化）或二维（未扁平化），两种都吃\n\
          \        for a in _as_list(it):\n            if not isinstance(a, dict):\n\
          \                continue\n            link = (a.get(\"link\") or \"\").strip()\n\
          \            title = (a.get(\"title\") or \"\").strip()\n            if\
          \ not link or not title:\n                continue\n\n            # 1) 时间窗预筛：只留\
          \ 48 小时内\n            pub = a.get(\"published\") or \"\"\n            try:\n\
          \                t = datetime.datetime.fromisoformat(pub.replace(\"Z\",\
          \ \"+00:00\"))\n                if (now - t).total_seconds() > 48 * 3600:\n\
          \                    continue\n            except Exception:\n         \
          \       pass  # 解析不了就放行，交给后面的模型判断\n\n            # 2) 去重：链接 + 标题双归一化\n \
          \           key_link = re.sub(r\"[?#].*$\", \"\", link).rstrip(\"/\")\n\
          \            key_title = re.sub(r\"\\W+\", \"\", title).lower()\n      \
          \      if key_link in seen_links or key_title in seen_titles:\n        \
          \        continue\n            seen_links.add(key_link)\n            seen_titles.add(key_title)\n\
          \n            out.append({\n                \"id\": a.get(\"id\") or key_link,\n\
          \                \"title\": title,\n                \"link\": link,\n  \
          \              \"source\": guess_source(link),\n                \"published\"\
          : pub,\n                \"snippet\": (a.get(\"summary\") or \"\")[:300],\n\
          \            })\n\n    return {\"items\": json.dumps(out[:120], ensure_ascii=False),\
          \ \"count\": len(out)}"
        code_language: python3
